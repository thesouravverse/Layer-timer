<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Image Timer — Layer Sequencer</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --panel-2: #1f2430;
    --line: #2a3040;
    --text: #e6e9ef;
    --muted: #8b93a7;
    --accent: #5b8cff;
    --accent-2: #2ec3a6;
    --danger: #ff5d6c;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: system-ui, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  header {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 10px 16px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
    flex-wrap: wrap;
  }
  header h1 { font-size: 16px; margin: 0; letter-spacing: .3px; }
  header h1 span { color: var(--accent); }

  .topnav{display:flex;align-items:center;gap:6px}
  .topnav a{color:var(--muted);text-decoration:none;font-size:13px;font-weight:600;padding:6px 10px;border-radius:8px;border:1px solid transparent}
  .topnav a:hover{color:var(--text);border-color:var(--line)}
  .topnav a.active{color:#fff;background:var(--panel-2);border-color:var(--line)}
  .fab-play{position:fixed;right:14px;bottom:14px;z-index:60;display:none;box-shadow:0 6px 20px rgba(0,0,0,.4)}
  @media (pointer:coarse){ .fab-play{display:inline-flex} }

  .mode-toggle { display: flex; background: var(--panel-2); border-radius: 999px; padding: 3px; }
  .mode-toggle button {
    border: 0; background: transparent; color: var(--muted);
    padding: 7px 14px; border-radius: 999px; cursor: pointer; font-size: 13px; font-weight: 600;
  }
  .mode-toggle button.active { background: var(--accent); color: #fff; }

  .transport { display: flex; align-items: center; gap: 8px; margin-left: auto; flex-wrap: wrap; }

  button.btn {
    border: 1px solid var(--line); background: var(--panel-2); color: var(--text);
    padding: 8px 12px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600;
    display: inline-flex; align-items: center; gap: 6px;
  }
  button.btn:hover { border-color: var(--accent); }
  button.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.btn.ghost { background: transparent; }
  button.btn:disabled { opacity: .4; cursor: default; }

  label.check { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; cursor: pointer; }

  main { flex: 1; display: flex; min-height: 0; }

  /* Sidebar */
  aside {
    width: 340px; min-width: 300px; background: var(--panel);
    border-right: 1px solid var(--line); display: flex; flex-direction: column;
  }
  .side-head { padding: 12px; border-bottom: 1px solid var(--line); display: flex; gap: 8px; }
  .side-head .btn { flex: 1; justify-content: center; }

  .layers { overflow-y: auto; padding: 10px; flex: 1; }
  .empty { color: var(--muted); text-align: center; padding: 40px 20px; font-size: 13px; line-height: 1.6; }

  .layer {
    background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 10px; margin-bottom: 10px; display: flex; gap: 10px; align-items: flex-start;
  }
  .layer.hidden-layer { opacity: .45; }
  .layer .thumb {
    width: 56px; height: 56px; border-radius: 8px; background:
      linear-gradient(45deg,#20242e 25%,transparent 25%,transparent 75%,#20242e 75%),
      linear-gradient(45deg,#20242e 25%,#171a21 25%,#171a21 75%,#20242e 75%);
    background-size: 14px 14px; background-position: 0 0, 7px 7px;
    flex-shrink: 0; overflow: hidden; display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  .layer .thumb img { max-width: 100%; max-height: 100%; display: block; }
  .layer .meta { flex: 1; min-width: 0; }
  .layer .name {
    font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    background: transparent; border: 0; color: var(--text); width: 100%; padding: 0 0 6px 0;
  }
  .layer .name:focus { outline: none; border-bottom: 1px solid var(--accent); }
  .timings { display: flex; gap: 8px; }
  .field { flex: 1; }
  .field label { display: block; font-size: 10px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); margin-bottom: 3px; }
  .field input {
    width: 100%; background: var(--bg); border: 1px solid var(--line); color: var(--text);
    border-radius: 6px; padding: 6px 7px; font-size: 13px;
  }
  .field input:focus { outline: none; border-color: var(--accent); }
  .layer .tools { display: flex; flex-direction: column; gap: 4px; }
  .icon-btn {
    width: 28px; height: 28px; border: 1px solid var(--line); background: var(--bg); color: var(--muted);
    border-radius: 6px; cursor: pointer; font-size: 13px; line-height: 1; display: flex; align-items: center; justify-content: center;
  }
  .icon-btn:hover { color: var(--text); border-color: var(--accent); }
  .icon-btn.danger:hover { color: var(--danger); border-color: var(--danger); }

  /* Stage */
  .stage-wrap { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .stage {
    flex: 1; position: relative; display: flex; align-items: center; justify-content: center;
    background:
      radial-gradient(circle at center, #14171e 0%, #0b0d11 100%);
    overflow: hidden;
  }
  .canvas {
    position: relative; max-width: 90%; max-height: 90%;
  }
  .canvas img {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    max-width: 70vw; max-height: 72vh; display: none;
    image-rendering: auto;
  }
  .canvas img.on { display: block; }
  .stage .placeholder { color: var(--muted); font-size: 14px; text-align: center; line-height: 1.7; }
  .stage .placeholder b { color: var(--text); }

  /* Timeline footer */
  .timeline {
    padding: 12px 16px; background: var(--panel); border-top: 1px solid var(--line);
    display: flex; align-items: center; gap: 14px;
  }
  .time-read { font-variant-numeric: tabular-nums; font-size: 13px; color: var(--muted); min-width: 120px; }
  .time-read b { color: var(--text); }
  input[type=range].scrub { flex: 1; accent-color: var(--accent); }
  .loop-badge { font-size: 12px; color: var(--muted); }

  /* Overlay-only column visibility */
  body.mode-seq .overlay-only { display: none; }
  body.mode-seq .seq-hint { display: block; }
  .seq-hint { display: none; font-size: 11px; color: var(--muted); margin-top: 4px; }

  ::-webkit-scrollbar { width: 10px; }
  ::-webkit-scrollbar-thumb { background: #2a3040; border-radius: 6px; }
</style>
</head>
<body class="mode-overlay">
  <header>
    <h1>Image<span>Timer</span></h1>
    <nav class="topnav">
      <a href="index.html" class="active">Layer Timer</a>
      <a href="one-to-many.html">One → Many</a>
      <a href="bg-remover.html">Bg Remover</a>
      <button id="trayBtn" class="btn" style="padding:6px 10px;">🗂 Tray <b id="trayCount">0</b></button>
    </nav>
    <div class="mode-toggle" id="modeToggle">
      <button data-mode="overlay" class="active">Overlay</button>
      <button data-mode="seq">Sequence</button>
    </div>
    <div class="transport">
      <label class="check"><input type="checkbox" id="loopChk" checked /> Loop</label>
      <label class="check">Speed
        <select id="speedSel" style="background:var(--panel-2);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:5px;">
          <option value="0.25">0.25×</option>
          <option value="0.5">0.5×</option>
          <option value="1" selected>1×</option>
          <option value="2">2×</option>
          <option value="4">4×</option>
        </select>
      </label>
      <label class="check" title="Background used behind transparent frames (also for export)">BG
        <input type="color" id="bgColor" value="#000000" style="width:30px;height:26px;border:1px solid var(--line);border-radius:6px;background:var(--panel-2);cursor:pointer;" />
      </label>
      <button class="btn" id="stopBtn">⏹ Stop</button>
      <button class="btn primary" id="playBtn">▶ Play</button>
      <button class="btn" id="exportBtn">⤓ Export MP4</button>
    </div>
  </header>

  <main>
    <aside>
      <div class="side-head">
        <button class="btn primary" id="addBtn">＋ Add images</button>
        <button class="btn ghost" id="clearBtn">Clear all</button>
        <input type="file" id="fileInput" accept="image/*" multiple hidden />
      </div>
      <div class="layers" id="layers">
        <div class="empty" id="emptyMsg">
          No layers yet.<br />
          Click <b>Add images</b> to load your walk-cycle frames.<br /><br />
          Each layer gets a timer that controls when it appears.
        </div>
      </div>
    </aside>

    <div class="stage-wrap">
      <div class="stage">
        <div class="canvas" id="canvas">
          <div class="placeholder" id="stagePlaceholder">
            <b>Stage</b><br />Your layers stack here, pinned to the same center.<br />
            Hit <b>Play</b> to run the timeline.
          </div>
        </div>
      </div>
      <div class="timeline">
        <div class="time-read"><b id="curTime">0.00</b> / <span id="totTime">0.00</span> s</div>
        <input type="range" class="scrub" id="scrub" min="0" max="1000" value="0" />
        <span class="loop-badge" id="frameBadge"></span>
      </div>
    </div>
  </main>

<button class="btn primary fab-play" id="fabPlay">▶ Play</button>

<script src="tray.js?v=20260809-side-workspace-2"></script>
<script>
(() => {
  "use strict";

  // ---------- State ----------
  let layers = [];          // { id, name, url, img, start, dur, visible }
  let mode = "overlay";     // "overlay" | "seq"
  let playing = false;
  let playhead = 0;         // seconds
  let lastTs = 0;
  let uid = 1;

  const el = {
    fileInput: document.getElementById("fileInput"),
    addBtn: document.getElementById("addBtn"),
    clearBtn: document.getElementById("clearBtn"),
    layers: document.getElementById("layers"),
    emptyMsg: document.getElementById("emptyMsg"),
    canvas: document.getElementById("canvas"),
    stagePlaceholder: document.getElementById("stagePlaceholder"),
    playBtn: document.getElementById("playBtn"),
    stopBtn: document.getElementById("stopBtn"),
    loopChk: document.getElementById("loopChk"),
    speedSel: document.getElementById("speedSel"),
    modeToggle: document.getElementById("modeToggle"),
    curTime: document.getElementById("curTime"),
    totTime: document.getElementById("totTime"),
    scrub: document.getElementById("scrub"),
    frameBadge: document.getElementById("frameBadge"),
    bgColor: document.getElementById("bgColor"),
    exportBtn: document.getElementById("exportBtn"),
  };

  // ---------- Timeline helpers ----------
  // Sequence mode: layers play back-to-back. Each layer's effective start is the
  // sum of previous durations; only one layer visible at a time.
  // Overlay mode: each layer uses its own start + dur; many can overlap.
  function seqStart(index) {
    let t = 0;
    for (let i = 0; i < index; i++) t += Math.max(0, layers[i].dur);
    return t;
  }

  function totalDuration() {
    if (layers.length === 0) return 0;
    if (mode === "seq") {
      return layers.reduce((s, l) => s + Math.max(0, l.dur), 0);
    }
    // overlay: latest end time
    return layers.reduce((m, l) => Math.max(m, l.start + Math.max(0, l.dur)), 0);
  }

  function layerVisibleAt(layer, index, t) {
    if (!layer.visible) return false;
    const start = mode === "seq" ? seqStart(index) : layer.start;
    const end = start + Math.max(0, layer.dur);
    return t >= start && t < end;
  }

  // ---------- Rendering the stage ----------
  function renderStage() {
    const t = playhead;
    let anyImg = false;
    let activeIdx = -1;

    layers.forEach((layer, i) => {
      if (!layer.img) return;
      anyImg = true;
      const on = layerVisibleAt(layer, i, t);
      if (on) activeIdx = i;
      layer.img.classList.toggle("on", on);
    });

    el.stagePlaceholder.style.display = anyImg ? "none" : "block";

    // Update time readouts
    const total = totalDuration();
    el.curTime.textContent = t.toFixed(2);
    el.totTime.textContent = total.toFixed(2);
    el.scrub.value = total > 0 ? Math.round((t / total) * 1000) : 0;

    if (mode === "seq") {
      el.frameBadge.textContent = activeIdx >= 0
        ? `Frame ${activeIdx + 1} / ${layers.length}`
        : "";
    } else {
      const count = layers.filter((l, i) => layerVisibleAt(l, i, t)).length;
      el.frameBadge.textContent = layers.length ? `${count} visible` : "";
    }
  }

  // ---------- Playback loop ----------
  function tick(ts) {
    if (!playing) return;
    if (!lastTs) lastTs = ts;
    const speed = parseFloat(el.speedSel.value) || 1;
    const dt = ((ts - lastTs) / 1000) * speed;
    lastTs = ts;

    const total = totalDuration();
    playhead += dt;

    if (playhead >= total) {
      if (el.loopChk.checked && total > 0) {
        playhead = playhead % total;
      } else {
        playhead = total;
        pause();
        renderStage();
        return;
      }
    }
    renderStage();
    requestAnimationFrame(tick);
  }

  function play() {
    if (layers.length === 0) return;
    if (totalDuration() <= 0) return;
    if (playhead >= totalDuration()) playhead = 0;
    playing = true;
    lastTs = 0;
    el.playBtn.innerHTML = "⏸ Pause";
    el.playBtn.classList.remove("primary");
    const f = document.getElementById("fabPlay"); if (f) f.textContent = "⏸ Pause";
    requestAnimationFrame(tick);
  }
  function pause() {
    playing = false;
    el.playBtn.innerHTML = "▶ Play";
    el.playBtn.classList.add("primary");
    const f = document.getElementById("fabPlay"); if (f) f.textContent = "▶ Play";
  }
  function stop() {
    pause();
    playhead = 0;
    renderStage();
  }

  // ---------- Layer list UI ----------
  function buildLayerImages() {
    // Remove old imgs (keep placeholder)
    [...el.canvas.querySelectorAll("img")].forEach(n => n.remove());
    layers.forEach(layer => {
      if (!layer.img) {
        const img = new Image();
        img.src = layer.url;
        layer.img = img;
      }
      el.canvas.appendChild(layer.img);
    });
  }

  function renderLayers() {
    el.emptyMsg.style.display = layers.length ? "none" : "block";
    // Clear existing cards
    [...el.layers.querySelectorAll(".layer")].forEach(n => n.remove());

    layers.forEach((layer, i) => {
      const card = document.createElement("div");
      card.className = "layer" + (layer.visible ? "" : " hidden-layer");

      const startVal = mode === "seq" ? seqStart(i) : layer.start;

      card.innerHTML = `
        <div class="thumb" title="Toggle visibility"><img src="${layer.url}" /></div>
        <div class="meta">
          <input class="name" value="${escapeHtml(layer.name)}" />
          <div class="timings">
            <div class="field overlay-only">
              <label>Start (s)</label>
              <input type="number" step="0.05" min="0" class="in-start" value="${layer.start}" />
            </div>
            <div class="field">
              <label>Duration (s)</label>
              <input type="number" step="0.05" min="0" class="in-dur" value="${layer.dur}" />
            </div>
          </div>
          <div class="seq-hint">Plays at ${startVal.toFixed(2)}s → ${(startVal + layer.dur).toFixed(2)}s</div>
        </div>
        <div class="tools">
          <button class="icon-btn t-up" title="Move up">▲</button>
          <button class="icon-btn t-down" title="Move down">▼</button>
          <button class="icon-btn t-vis" title="Show / hide">${layer.visible ? "👁" : "🚫"}</button>
          <button class="icon-btn danger t-del" title="Delete">✕</button>
        </div>
      `;

      // Wire events
      card.querySelector(".thumb").addEventListener("click", () => {
        layer.visible = !layer.visible; renderLayers(); renderStage();
      });
      card.querySelector(".name").addEventListener("input", e => { layer.name = e.target.value; });
      const sIn = card.querySelector(".in-start");
      if (sIn) sIn.addEventListener("input", e => {
        layer.start = clampNum(e.target.value); renderStage();
      });
      card.querySelector(".in-dur").addEventListener("input", e => {
        layer.dur = clampNum(e.target.value); refreshHints(); renderStage();
      });
      card.querySelector(".t-up").addEventListener("click", () => moveLayer(i, -1));
      card.querySelector(".t-down").addEventListener("click", () => moveLayer(i, +1));
      card.querySelector(".t-vis").addEventListener("click", () => {
        layer.visible = !layer.visible; renderLayers(); renderStage();
      });
      card.querySelector(".t-del").addEventListener("click", () => deleteLayer(i));

      el.layers.appendChild(card);
    });
  }

  function refreshHints() {
    // Update seq hint text without full rebuild
    [...el.layers.querySelectorAll(".layer")].forEach((card, i) => {
      const hint = card.querySelector(".seq-hint");
      if (hint && layers[i]) {
        const s = seqStart(i);
        hint.textContent = `Plays at ${s.toFixed(2)}s → ${(s + layers[i].dur).toFixed(2)}s`;
      }
    });
  }

  function moveLayer(i, dir) {
    const j = i + dir;
    if (j < 0 || j >= layers.length) return;
    [layers[i], layers[j]] = [layers[j], layers[i]];
    buildLayerImages();
    renderLayers();
    renderStage();
  }

  function deleteLayer(i) {
    const [removed] = layers.splice(i, 1);
    if (removed.url.startsWith("blob:")) URL.revokeObjectURL(removed.url);
    buildLayerImages();
    renderLayers();
    renderStage();
  }

  // ---------- Adding images ----------
  el.addBtn.addEventListener("click", () => el.fileInput.click());
  el.fileInput.addEventListener("change", e => {
    const files = [...e.target.files].filter(f => f.type.startsWith("image/"));
    files.forEach(f => {
      const url = URL.createObjectURL(f);
      layers.push({
        id: uid++,
        name: f.name.replace(/\.[^.]+$/, ""),
        url,
        img: null,
        start: +(layers.length * 0.2).toFixed(2), // stagger defaults in overlay
        dur: 0.2,
        visible: true,
      });
    });
    el.fileInput.value = "";
    buildLayerImages();
    renderLayers();
    renderStage();
  });

  el.clearBtn.addEventListener("click", () => {
    if (layers.length && !confirm("Remove all layers?")) return;
    layers.forEach(l => { if (l.url.startsWith("blob:")) URL.revokeObjectURL(l.url); });
    layers = [];
    playhead = 0;
    buildLayerImages();
    renderLayers();
    renderStage();
    pause();
  });

  // ---------- Mode toggle ----------
  el.modeToggle.addEventListener("click", e => {
    const btn = e.target.closest("button[data-mode]");
    if (!btn) return;
    mode = btn.dataset.mode;
    [...el.modeToggle.children].forEach(b => b.classList.toggle("active", b === btn));
    document.body.classList.toggle("mode-seq", mode === "seq");
    document.body.classList.toggle("mode-overlay", mode === "overlay");
    playhead = 0;
    renderLayers();
    renderStage();
  });

  // ---------- Transport ----------
  el.playBtn.addEventListener("click", () => { playing ? pause() : play(); });
  el.stopBtn.addEventListener("click", stop);
  el.bgColor.addEventListener("input", () => {
    document.querySelector(".stage").style.background = el.bgColor.value;
  });
  el.exportBtn.addEventListener("click", exportVideo);
  el.scrub.addEventListener("input", e => {
    const total = totalDuration();
    playhead = total * (e.target.value / 1000);
    renderStage();
  });
  document.addEventListener("keydown", e => {
    if (e.code === "Space" && e.target.tagName !== "INPUT") {
      e.preventDefault();
      playing ? pause() : play();
    }
  });

  // ---------- MP4 / video export ----------
  function pickMime() {
    const prefs = [
      "video/mp4;codecs=avc1.42E01E",
      "video/mp4;codecs=avc1.640028",
      "video/mp4;codecs=h264",
      "video/mp4",
      "video/webm;codecs=vp9",
      "video/webm;codecs=vp8",
      "video/webm",
    ];
    for (const m of prefs) {
      if (window.MediaRecorder && MediaRecorder.isTypeSupported(m)) return m;
    }
    return "";
  }

  function exportCanvasSize() {
    let maxW = 0, maxH = 0;
    layers.forEach(l => {
      if (l.img && l.img.naturalWidth) {
        maxW = Math.max(maxW, l.img.naturalWidth);
        maxH = Math.max(maxH, l.img.naturalHeight);
      }
    });
    if (!maxW) { maxW = 1280; maxH = 720; }
    const cap = 1920;
    const scale = Math.min(1, cap / maxW, cap / maxH);
    // even dimensions required by most codecs
    const W = Math.max(2, Math.round(maxW * scale / 2) * 2);
    const H = Math.max(2, Math.round(maxH * scale / 2) * 2);
    return { W, H, scale };
  }

  function drawFrameTo(ctx, W, H, t) {
    ctx.fillStyle = el.bgColor.value;
    ctx.fillRect(0, 0, W, H);
    layers.forEach((layer, i) => {
      if (!layer.img || !layer.img.naturalWidth) return;
      if (!layerVisibleAt(layer, i, t)) return;
      const iw = layer.img.naturalWidth, ih = layer.img.naturalHeight;
      const s = Math.min(W / iw, H / ih); // fit each frame inside the canvas, centered
      const dw = iw * s, dh = ih * s;
      ctx.drawImage(layer.img, (W - dw) / 2, (H - dh) / 2, dw, dh);
    });
  }

  async function exportVideo() {
    if (layers.length === 0) { alert("Add some images first."); return; }
    const total = totalDuration();
    if (total <= 0) { alert("Total duration is 0 — give your layers a duration."); return; }
    if (!window.MediaRecorder) { alert("This browser doesn't support MediaRecorder."); return; }
    const mime = pickMime();
    if (!mime) { alert("No supported video encoder found in this browser."); return; }

    // Make sure images are decoded.
    await Promise.all(layers.map(l => (l.img && l.img.decode ? l.img.decode().catch(() => {}) : Promise.resolve())));

    pause();
    const { W, H } = exportCanvasSize();
    const cv = document.createElement("canvas");
    cv.width = W; cv.height = H;
    const ctx = cv.getContext("2d");

    const fps = 30;
    const stream = cv.captureStream(fps);
    const rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 8_000_000 });
    const chunks = [];
    rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };

    const isMp4 = mime.startsWith("video/mp4");
    const ext = isMp4 ? "mp4" : "webm";

    const done = new Promise(resolve => {
      rec.onstop = () => {
        const blob = new Blob(chunks, { type: mime });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = `image-timer-${mode}.${ext}`;
        a.click();
        setTimeout(() => URL.revokeObjectURL(a.href), 4000);
        resolve();
      };
    });

    el.exportBtn.disabled = true;
    const origLabel = el.exportBtn.textContent;

    rec.start();
    const startTs = performance.now();
    await new Promise(resolve => {
      function frame() {
        const t = (performance.now() - startTs) / 1000;
        if (t >= total) {
          drawFrameTo(ctx, W, H, Math.max(0, total - 0.0001));
          resolve();
          return;
        }
        drawFrameTo(ctx, W, H, t);
        el.exportBtn.textContent = `● Rec ${t.toFixed(1)}s`;
        requestAnimationFrame(frame);
      }
      frame();
    });

    // small tail so the last frame is captured, then stop
    await new Promise(r => setTimeout(r, 120));
    rec.stop();
    await done;

    el.exportBtn.disabled = false;
    el.exportBtn.textContent = origLabel;
    if (!isMp4) {
      alert("Your browser can't record MP4 directly, so a WebM was saved instead.\nIt plays everywhere and converts to MP4 easily (e.g. in any converter or VLC).\nTip: Chrome or Edge on Windows usually record MP4.");
    }
  }

  // ---------- Utils ----------
  function clampNum(v) { const n = parseFloat(v); return isNaN(n) || n < 0 ? 0 : n; }
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  // Receive an image from the Tray (from One→Many or Bg Remover)
  window.TRAY_USE_LABEL = "Add as layer";
  window.TRAY_IMPORT = (blob, name) => {
    const url = URL.createObjectURL(blob);
    layers.push({
      id: uid++,
      name: (name || "layer").replace(/\.[^.]+$/, ""),
      url, img: null,
      start: +(layers.length * 0.2).toFixed(2),
      dur: 0.2,
      visible: true,
    });
    buildLayerImages();
    renderLayers();
    renderStage();
    if (window.TrayUI) window.TrayUI.close();
  };

  document.getElementById("fabPlay")?.addEventListener("click", () => (playing ? pause() : play()));

  // init
  renderStage();
})();
</script>
</body>
</html>
